services:
  nextcloud:
    image: nextcloud:32.0.13-apache
    volumes:
      - nextcloudStore:/var/www/html
    ports:
      - "16000:80"
    environment:
      - NEXTCLOUD_ADMIN_PASSWORD=nextcloud
      - NEXTCLOUD_ADMIN_USER=nextcloud
      - NEXTCLOUD_TRUSTED_DOMAINS=*.*.*.*
      - POSTGRES_DB=nextcloud
      - POSTGRES_PASSWORD=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_HOST=database
      - REDIS_HOST=redis
      - SMTP_HOST=maildev
      - SMTP_PORT=25
      - SMTP_AUTHTYPE=NONE
      - MAIL_FROM_ADDRESS=nextcloud
      - MAIL_DOMAIN=1024.lu
    depends_on:
      - database
      - redis
  database:
    image: postgres:16-alpine
    restart: on-failure
    volumes:
      - nextcloudDbStore:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud
  maildev:
    image: maildev/maildev
    ports:
      - "7078:80"
      - "7025:25"
  redis:
    image: redis:alpine
    restart: on-failure

volumes:
  nextcloudStore:
  nextcloudDbStore:
